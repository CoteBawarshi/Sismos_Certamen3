<!-- BLOQUE DE DESCRIPCIÓN CON EDICIÓN INTERACTIVA -->
{% if clave %}
    <div style="background: #eef2f5; border-left: 5px solid #2c3e50; padding: 18px 20px; margin-bottom: 25px; border-radius: 4px;">
        <!-- Modo Visualización -->
        <div id="vista-desc">
            <!-- Texto de la descripción (Sin título adentro) -->
            <p style="margin: 0; color: #34495e; font-size: 1rem; line-height: 1.6;">
                {{ descripcion }}
            </p>

            <!-- Botón 'Editar' en la esquina inferior derecha -->
            <div style="text-align: right; margin-top: 12px;">
                <button onclick="document.getElementById('vista-desc').style.display='none'; document.getElementById('form-desc').style.display='block';" 
                        style="background: none; border: none; color: #2980b9; cursor: pointer; font-size: 0.9rem; padding: 0; font-weight: 500;">
                    Editar
                </button>
            </div>
        </div>

        <!-- Modo Edición -->
        <div id="form-desc" style="display: none;">
            <form action="{% url 'guardar_descripcion' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="clave" value="{{ clave }}">
                <label style="font-weight: bold; color: #2c3e50; display: block; margin-bottom: 5px;">Editar descripción:</label>
                <textarea name="descripcion" rows="3" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; font-size: 0.95rem; box-sizing: border-box;">{{ descripcion }}</textarea>
                <div style="margin-top: 8px; text-align: right;">
                    <button type="button" onclick="document.getElementById('form-desc').style.display='none'; document.getElementById('vista-desc').style.display='block';" 
                            style="background: #7f8c8d; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Cancelar</button>
                    <button type="submit" style="background: #27ae60; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
{% endif %}
